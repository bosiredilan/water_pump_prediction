<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Water Pump Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            color: white;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .title p {
            color: #dbeafe;
            font-size: 1.1rem;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #f8fafc;
        }

        input,
        select {
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,0.18);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: #dbeafe;
        }

        input:focus,
        select:focus {
            background: rgba(255,255,255,0.28);
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(255,255,255,0.3);
        }

        select option {
            color: black;
        }

        .button-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
        }

        .result {
            margin-top: 30px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fef9c3;
        }

        @media (max-width: 768px) {
            .title h1 {
                font-size: 2.2rem;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>
